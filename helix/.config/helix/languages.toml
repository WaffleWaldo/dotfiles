[[language]]
name = "svelte"
language-servers = ["svelteserver", "typescript-language-server"]

[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "javascript"
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "python"
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true
